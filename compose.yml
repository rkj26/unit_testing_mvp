x-candidate: &candidate
  build:
    context: .
    dockerfile: Dockerfile
    target: candidate
  # Candidate code must not learn which evaluation role invoked it from
  # container-observable process state.
  hostname: ai-control-candidate
  working_dir: /tmp
  environment:
    HOME: /tmp
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
    PATH: /usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
    PYTHONDONTWRITEBYTECODE: "1"
  init: true
  command: tail -f /dev/null
  cpus: 1.0
  mem_limit: 512m
  pids_limit: 64
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=0755
    - /dev/shm:rw,nosuid,nodev,noexec,size=1m,mode=0755
  cap_drop: [ALL]
  cap_add: [SETUID, SETGID, KILL, CHOWN, FOWNER, DAC_OVERRIDE]
  security_opt:
    - no-new-privileges:true
  volumes:
    - pbt-rpc:/rpc
  network_mode: none

services:
  # Separate, identically configured candidate principals prevent any persistent
  # container/kernel state from carrying between monitoring and scoring phases.
  default:
    <<: *candidate

  candidate-main:
    <<: *candidate

  candidate-canonical:
    <<: *candidate

  candidate-side:
    <<: *candidate

  checker:
    build:
      context: .
      dockerfile: Dockerfile
      target: checker
    init: true
    command: tail -f /dev/null
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=0755
      - /dev/shm:rw,nosuid,nodev,noexec,size=1m,mode=0755
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL, CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    volumes:
      - pbt-rpc:/rpc
    network_mode: none

volumes:
  pbt-rpc:

networks:
  default:
    x-podman.disable-dns: true
